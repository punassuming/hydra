apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hydra-worker
  template:
    metadata:
      labels:
        app: hydra-worker
    spec:
      containers:
        - name: worker
          image: hydra-worker:latest
          # Domain credentials (API_TOKEN, REDIS_PASSWORD, DOMAIN) are injected
          # from a Kubernetes Secret created by scripts/start-domain-workers.sh:
          #   WORKER_BACKEND=k8s ADMIN_TOKEN=... ./scripts/start-domain-workers.sh <domain> <scale>
          # The script names the secret hydra-worker-<domain> (e.g. hydra-worker-prod).
          #
          # NOTE: Replace the secret name below to match your domain, or apply this
          # manifest via a Kustomize overlay / Helm values file that substitutes the
          # domain-specific secret name rather than editing this file directly.
          envFrom:
            - secretRef:
                name: hydra-worker-prod  # REPLACE: hydra-worker-<your-domain>
          env:
            - name: REDIS_URL
              value: redis://hydra-redis:6379/0
            - name: MONGO_URL
              value: mongodb://hydra-mongo:27017
            - name: MONGO_DB
              value: hydra_jobs
            - name: MAX_CONCURRENCY
              value: "2"
            - name: DEPLOYMENT_TYPE
              value: kubernetes
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # The heartbeat loop touches this file every ~2s regardless of Redis
          # reachability, so a stale/missing file means the process is hung —
          # matches worker/Dockerfile's HEALTHCHECK.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys,time; p=os.getenv('WORKER_HEARTBEAT_FILE','/tmp/hydra_worker_heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<30 else 1)"
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hydra-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hydra-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
