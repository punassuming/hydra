{{- /*
Generates ADMIN_TOKEN, CREDENTIAL_ENCRYPTION_KEY, and the default-domain seed
token/password once, then preserves them across `helm upgrade` by reading
back any existing Secret of the same name (via `lookup`) instead of
regenerating — otherwise every upgrade would invalidate the admin token,
encrypted credentials, and worker auth. `lookup` returns nil when there's no
live cluster to query (e.g. `helm template`/`helm lint` in CI), so this still
renders fine there — it just means CI never sees "preserved" values, which
is expected since there's no real Secret for it to find.
*/ -}}
{{- $secretName := include "hydra.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}

{{- $adminToken := "" -}}
{{- $credentialKey := "" -}}
{{- $seedToken := "" -}}
{{- $seedRedisPassword := "" -}}

{{- if $existing -}}
{{- $adminToken = index $existing.data "ADMIN_TOKEN" | default "" | b64dec -}}
{{- $credentialKey = index $existing.data "CREDENTIAL_ENCRYPTION_KEY" | default "" | b64dec -}}
{{- $seedToken = index $existing.data "SEED_DOMAIN_TOKEN" | default "" | b64dec -}}
{{- $seedRedisPassword = index $existing.data "SEED_DOMAIN_REDIS_PASSWORD" | default "" | b64dec -}}
{{- end -}}

{{- if not $adminToken -}}
{{- $adminToken = randAlphaNum 48 -}}
{{- end -}}
{{- if not $credentialKey -}}
{{- $credentialKey = randBytes 32 | replace "+" "-" | replace "/" "_" -}}
{{- end -}}
{{- if not $seedToken -}}
{{- $seedToken = randAlphaNum 48 -}}
{{- end -}}
{{- if not $seedRedisPassword -}}
{{- $seedRedisPassword = randAlphaNum 32 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "hydra.labels" . | nindent 4 }}
  annotations:
    # Never let `helm upgrade` recreate this Secret from scratch — see the
    # lookup-based preservation above. This annotation only documents intent;
    # the actual preservation is the lookup logic, not this annotation.
    hydra.io/note: "credentials preserved across helm upgrade; see templates/secret.yaml"
type: Opaque
stringData:
  ADMIN_TOKEN: {{ $adminToken | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ $credentialKey | quote }}
  SEED_DOMAIN: {{ .Values.domainSeed.defaultDomain | quote }}
  SEED_DOMAIN_TOKEN: {{ $seedToken | quote }}
  SEED_DOMAIN_REDIS_PASSWORD: {{ $seedRedisPassword | quote }}
