[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-jobs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "croniter==2.0.5",
    "cryptography>=46.0.5",
    "fastapi==0.115.0",
    "google-generativeai==0.3.2",
    "openai==1.12.0",
    "pydantic==2.9.2",
    "pymongo==4.10.1",
    "python-dotenv==1.0.1",
    "redis==5.0.8",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.0.36",
    "sse-starlette==2.0.0",
    "uvicorn[standard]==0.30.1",
]

[project.scripts]
hydra-ctl = "cli.__main__:entrypoint"

[tool.setuptools.packages.find]
include = ["cli*", "scheduler*", "worker*"]

[dependency-groups]
dev = [
    "httpx",
    "pytest==8.3.5",
    "ruff==0.15.22",
]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = [".venv", "ui", "go-worker"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402", # module-level import not at top of file — used deliberately for lazy/conditional imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"] # test files sometimes import fixtures/symbols for their side effects
