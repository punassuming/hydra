[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-jobs"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    # The lean set: everything the lite edition (and hydra-ctl) needs. `uv tool install .` / `pipx install .` gets
    # only these. The full scheduler/worker images install the `full` extra on top.
    "croniter==6.2.4",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "uvicorn==0.54.0",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# SQL executor/sensor support (the worker advertises `sql` only when SQLAlchemy imports).
sql = [
    "SQLAlchemy==2.0.36",
]
# Everything the full (Redis + MongoDB) edition imports: the scheduler API, orchestrator and Python worker.
full = [
    "cryptography>=50.0.2",
    "google-genai>=2.28.0",
    "openai==3.24.0",
    "pymongo==4.18.2",
    "python-dotenv==1.2.4",
    "redis==8.1.0",
    "SQLAlchemy==2.0.36",
    "sse-starlette==3.5.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
hydra-ctl = "cli.__main__:entrypoint"

[tool.setuptools.packages.find]
include = ["cli*", "scheduler*", "worker*", "hydra_lite*"]

[tool.setuptools.package-data]
"hydra_lite.store" = ["schema.sql", "migrations/*.sql"]
"hydra_lite.daemon" = ["static/*.html"]

[dependency-groups]
dev = [
    "httpx",
    "pytest==8.3.5",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = [".venv", "ui", "go-worker"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402", # module-level import not at top of file — used deliberately for lazy/conditional imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"] # test files sometimes import fixtures/symbols for their side effects
