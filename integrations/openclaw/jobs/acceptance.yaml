# Harmless, source-controlled jobs for integration acceptance.
- name: openclaw-echo
  user: acceptance
  executor:
    type: shell
    shell: bash
    script: "printf 'openclaw-acceptance\\n'"
  schedule:
    mode: immediate
    enabled: false
  max_retries: 1
  timeout: 10
- name: openclaw-timeout
  user: acceptance
  executor:
    type: shell
    shell: bash
    script: "sleep 2"
  schedule:
    mode: immediate
    enabled: false
  timeout: 1

