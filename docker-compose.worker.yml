services:
  # Standalone Python worker — points at an existing scheduler/Redis stack
  # (bundled or remote). Run with:
  #   docker compose -f docker-compose.worker.yml up -d --build --scale worker=N
  # See scripts/worker-up.sh and scripts/start-domain-workers.sh for wrappers.
  worker:
    image: hydra-worker:${HYDRA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    # Runs as the dedicated non-root identity worker/Dockerfile creates, with
    # a read-only root filesystem — jobs may only write under /tmp (the
    # tmpfs below) or an explicitly configured writable path
    # (HYDRA_TEMP_DIR). Validated against the executor types this project
    # supports (shell/python/batch/sql/http/external/sensor).
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt: ["no-new-privileges:true"]
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - WORKER_REQUIRE_REDIS_ACL=${WORKER_REQUIRE_REDIS_ACL:-true}
      # Leave WORKER_ID unset when scaling (--scale worker=N) so Docker
      # Compose's replica-index suffix keeps each instance's ID unique;
      # set it explicitly only when running a single named instance.
      - WORKER_ID=${WORKER_ID:-}
      - DOMAIN=${DOMAIN:-prod}
      - API_TOKEN=${API_TOKEN}
      - WORKER_TAGS=${WORKER_TAGS:-}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-2}
      # online | draining | disabled
      - WORKER_STATE=${WORKER_STATE:-online}
      - DEPLOYMENT_TYPE=${DEPLOYMENT_TYPE:-docker}
      - WORKER_METRICS_SAMPLE_SECONDS=${WORKER_METRICS_SAMPLE_SECONDS:-15}
      - WORKER_METRICS_WINDOW_SECONDS=${WORKER_METRICS_WINDOW_SECONDS:-1800}
      # Liveness file read by worker/Dockerfile's HEALTHCHECK; only useful to
      # override if you're bind-mounting a different tmpfs/path.
      - WORKER_HEARTBEAT_FILE=${WORKER_HEARTBEAT_FILE:-/tmp/hydra_worker_heartbeat}
      # Non-containerized execution path overrides — only relevant if your
      # worker image bundles alternate interpreter/shell/git locations.
      - HYDRA_PYTHON_PATH=${HYDRA_PYTHON_PATH:-}
      - HYDRA_SHELL_PATH=${HYDRA_SHELL_PATH:-}
      - HYDRA_GIT_PATH=${HYDRA_GIT_PATH:-}
      - HYDRA_TEMP_DIR=${HYDRA_TEMP_DIR:-}
