services:
  scheduler:
    volumes:
      - ./scheduler:/app/scheduler
    command: ["uvicorn", "scheduler.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - SEED_DOMAIN=${DOMAIN:-dev}
      - SEED_DOMAIN_TOKEN=${API_TOKEN:-}
      - SEED_DOMAIN_REDIS_PASSWORD=${REDIS_PASSWORD:-}

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WORKER_ID=${WORKER_ID:-}
      - DOMAIN=${DOMAIN:-prod}
      - API_TOKEN=${API_TOKEN:-}
      - WORKER_TAGS=${WORKER_TAGS:-dev}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-2}
      - WORKER_REQUIRE_REDIS_ACL=${WORKER_REQUIRE_REDIS_ACL:-true}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    volumes:
      - ./worker:/app/worker
