services:
  scheduler:
    volumes:
      - ./scheduler:/app/scheduler
    command: ["uvicorn", "scheduler.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Compose's `environment:` list form fully replaces the base file's
    # list on merge (no per-key merge) — so every var the base scheduler
    # service sets (docker-compose.yml) has to be repeated here too, not
    # just the two this overlay actually changes, or they silently vanish.
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${SCHEDULER_REDIS_PASSWORD:-}
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017}
      - MONGO_DB=${MONGO_DB:-hydra_jobs}
      - SCHEDULER_HEARTBEAT_TTL=${SCHEDULER_HEARTBEAT_TTL:-10}
      # Dev overlay override: seed the domain named by $DOMAIN (default
      # "dev") rather than the base file's "prod".
      - SEED_DOMAIN=${DOMAIN:-dev}
      - SEED_DOMAIN_TOKEN=${API_TOKEN:-}
      - SEED_DOMAIN_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Dev overlay override: demo-mode UI affordances default on; set
      # HYDRA_DEMO_MODE=false if you don't want them even in dev.
      - HYDRA_DEMO_MODE=${HYDRA_DEMO_MODE:-true}

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - WORKER_ID=${WORKER_ID:-}
      - DOMAIN=${DOMAIN:-prod}
      - API_TOKEN=${API_TOKEN:-}
      - WORKER_TAGS=${WORKER_TAGS:-dev}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-2}
      - WORKER_REQUIRE_REDIS_ACL=${WORKER_REQUIRE_REDIS_ACL:-true}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    volumes:
      - ./worker:/app/worker
    # redis/scheduler live on the base file's internal "backend" network —
    # without this, a service newly introduced here (rather than overriding
    # one already in docker-compose.yml) falls back to Compose's separate
    # implicit "default" network and can't reach either.
    networks: [backend]
