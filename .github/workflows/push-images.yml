name: Push container images

# Publishes the four deployable images to GHCR. Distinct from
# container-images.yml, which only validates that each image builds
# (push: false) on every push to main — this workflow is the one that
# actually ships a release, gated on release-please's own tag rather than
# every push to main so an in-progress, unreleased main isn't published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image tag (defaults to the pushed tag, or pyproject.toml's version for a manual run)
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: hydra-scheduler
            context: .
            file: scheduler/Dockerfile
          - image: hydra-worker
            context: .
            file: worker/Dockerfile
          - image: hydra-go-worker
            context: go-worker
            file: go-worker/Dockerfile
          - image: hydra-ui
            context: ui
            file: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        # Prefer the pushed release-please tag (v0.1.0 -> 0.1.0), matching
        # container-images.yml's version-only tagging scheme (no "v" prefix,
        # no "latest" — every image push is tied to a specific release).
        # Falls back to pyproject.toml's version for a manual
        # workflow_dispatch run not triggered by a tag push.
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VALUE="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            VALUE="${REF_NAME#v}"
          else
            VALUE=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
