name: Publish container images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image tag
        required: true
        default: 0.1.0

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: hydra-scheduler
            context: .
            file: scheduler/Dockerfile
          - image: hydra-worker
            context: .
            file: worker/Dockerfile
          - image: hydra-go-worker
            context: go-worker
            file: go-worker/Dockerfile
          - image: hydra-ui
            context: ui
            file: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
