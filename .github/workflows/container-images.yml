name: Build container images

on:
  push:
    branches:
      - main
    paths:
      - scheduler/**
      - worker/**
      - go-worker/**
      - ui/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/container-images.yml
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image tag (defaults to pyproject.toml's version)
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: hydra-scheduler
            context: .
            file: scheduler/Dockerfile
          - image: hydra-worker
            context: .
            file: worker/Dockerfile
          - image: hydra-go-worker
            context: go-worker
            file: go-worker/Dockerfile
          - image: hydra-ui
            context: ui
            file: ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # release-please is the single source of truth for the app version
        # (pyproject.toml's project.version); no separate literal to drift.
        run: |
          DEFAULT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "value=${INPUT_VERSION:-$DEFAULT_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.image }}:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
