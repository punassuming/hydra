name: release-please

# Automatic versioning + changelog + GitHub Releases, driven by Conventional
# Commits (see CONTRIBUTING.md). On every push to main (i.e. every merged
# PR), release-please either opens/updates a standing "release PR" that
# accumulates the version bump + CHANGELOG.md entries, or — if that release
# PR itself was just merged — tags the release and publishes GitHub Release
# notes generated from the same changelog.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # Prefer a PAT/GitHub App token (RELEASE_PLEASE_TOKEN) if the repo
          # has one configured: the default GITHUB_TOKEN cannot trigger other
          # workflows, so a release PR opened with it would not get the
          # normal python-ci.yml checks run against it before merge. Falls
          # back to GITHUB_TOKEN so this works with zero setup either way —
          # see CONTRIBUTING.md for how to add the PAT.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # A release created with the default GITHUB_TOKEN does not fire tag/release-triggered workflows, so the release
  # artifacts are produced by calling their workflows from here, only when this run actually created a release.
  publish-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/push-images.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}

  release-wheel:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-wheel.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
