name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Run tests
        run: |
          uv run --frozen pytest tests/ --ignore=tests/test_end_to_end.py -v --basetemp="${{ runner.temp }}/pytest"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Run ruff
        run: uv run --frozen ruff check .

  helm:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.16.3"

      - name: helm lint (strict)
        run: helm lint deploy/helm/hydra --strict

      - name: helm template — default values
        run: helm template hydra deploy/helm/hydra

      - name: helm template — separated scheduler mode + ingress enabled
        run: |
          helm template hydra deploy/helm/hydra \
            --set scheduler.mode=separated \
            --set ingress.enabled=true \
            --set ingress.className=nginx

      - name: helm template — multi-domain worker pools
        run: |
          cat > /tmp/multi-domain-values.yaml <<'EOF'
          workers:
            - name: python-default
              flavor: python
              replicas: 2
              domain: prod
              tags: "batch,data"
              allowedUsers: ""
              maxConcurrency: 4
              workerState: online
              requireRedisAcl: true
              image: {repository: hydra-worker, tag: latest}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 1Gi}
              autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 10, targetCPUUtilizationPercentage: 70}
              nodeSelector: {}
              tolerations: []
              affinity: {}
            - name: ml-pool
              flavor: go
              replicas: 1
              domain: ml
              tags: "ml"
              allowedUsers: ""
              maxConcurrency: 2
              workerState: online
              requireRedisAcl: true
              image: {repository: hydra-go-worker, tag: latest}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              autoscaling: {enabled: false, minReplicas: 1, maxReplicas: 10, targetCPUUtilizationPercentage: 70}
              nodeSelector: {}
              tolerations: []
              affinity: {}
          domainSeed:
            defaultDomain: prod
            extraDomains: ["ml"]
            image: {repository: hydra-scheduler, tag: latest}
          EOF
          helm template hydra deploy/helm/hydra -f /tmp/multi-domain-values.yaml

      - name: helm template — demoMode + extraEnv (regression check for the scheduler env/envFrom merge)
        run: |
          helm template hydra deploy/helm/hydra \
            --set demoMode.enabled=true \
            --set scheduler.extraEnv[0].name=EXTRA_ENV_TEST \
            --set scheduler.extraEnv[0].value=ok \
            > /tmp/demo-mode-render.yaml
          python3 - <<'PY'
          import sys
          import yaml

          docs = list(yaml.safe_load_all(open("/tmp/demo-mode-render.yaml")))
          scheduler_deploy = next(
              d for d in docs
              if d and d.get("kind") == "Deployment" and d["metadata"]["name"] == "hydra-scheduler"
          )
          container = scheduler_deploy["spec"]["template"]["spec"]["containers"][0]

          # extraEnv / demoMode must land in their own "env" list, never merged
          # into "envFrom" (whose items only ever have configMapRef/secretRef).
          for item in container.get("envFrom", []):
              assert set(item.keys()) <= {"configMapRef", "secretRef", "prefix"}, f"bad envFrom entry: {item}"

          env_names = {e["name"] for e in container.get("env", [])}
          assert "HYDRA_DEMO_MODE" in env_names, f"HYDRA_DEMO_MODE missing from env: {env_names}"
          assert "EXTRA_ENV_TEST" in env_names, f"EXTRA_ENV_TEST missing from env: {env_names}"
          print("OK: env/envFrom rendered correctly with demoMode + extraEnv set")
          PY

      - name: helm template — UI container port (regression check for the nginx-unprivileged 8080 switch)
        run: |
          helm template hydra deploy/helm/hydra > /tmp/default-render.yaml
          python3 - <<'PY'
          import yaml

          docs = list(yaml.safe_load_all(open("/tmp/default-render.yaml")))
          ui_service = next(
              d for d in docs
              if d and d.get("kind") == "Service" and d["metadata"]["name"] == "hydra-ui"
          )
          ui_deploy = next(
              d for d in docs
              if d and d.get("kind") == "Deployment" and d["metadata"]["name"] == "hydra-ui"
          )
          container = ui_deploy["spec"]["template"]["spec"]["containers"][0]

          # ui/Dockerfile switched to nginxinc/nginx-unprivileged, which can't
          # bind port 80 — the chart's Service targetPort, container
          # containerPort, and both probes must all agree on 8080, or the UI
          # silently fails readiness/liveness and the Service routes nowhere.
          assert ui_service["spec"]["ports"][0]["targetPort"] == 8080, ui_service["spec"]["ports"]
          assert container["ports"][0]["containerPort"] == 8080, container["ports"]
          assert container["readinessProbe"]["httpGet"]["port"] == 8080, container["readinessProbe"]
          assert container["livenessProbe"]["httpGet"]["port"] == 8080, container["livenessProbe"]
          print("OK: UI Service/Deployment/probes all agree on container port 8080")
          PY

  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: scheduler
            context: .
            dockerfile: scheduler/Dockerfile
          - service: worker
            context: .
            dockerfile: worker/Dockerfile
          - service: ui
            context: ui
            dockerfile: ui/Dockerfile
          - service: go-worker
            context: go-worker
            dockerfile: go-worker/Dockerfile

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: hydra-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  go-test:
    name: Go worker tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-worker/go.mod
          cache-dependency-path: go-worker/go.sum

      - name: Check formatting
        working-directory: go-worker
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        working-directory: go-worker
        run: go vet ./...

      # -race matters here: the worker is heavily concurrent (poll loop,
      # heartbeat, kill listener, per-job goroutines).
      - name: Run Go worker tests
        working-directory: go-worker
        run: go test -race ./...

  # Advisory dependency/vulnerability scan. Deliberately non-blocking
  # (continue-on-error) until the existing findings have been triaged -- flip
  # the steps to blocking once the baseline is clean.
  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: pip-audit (Python dependencies)
        continue-on-error: true
        run: |
          python -m pip install uv==0.5.13 pip-audit
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: npm audit (UI production dependencies)
        continue-on-error: true
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-worker/go.mod
          cache-dependency-path: go-worker/go.sum

      - name: govulncheck (Go worker)
        continue-on-error: true
        working-directory: go-worker
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  end-to-end:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test environment
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Create empty Compose environment file
        run: touch .env

      - name: Start scheduler dependencies and worker
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml up -d --build redis mongo scheduler worker

      - name: Run full-stack smoke test
        env:
          HYDRA_E2E: "1"
          HYDRA_E2E_DOMAIN: ci
          HYDRA_E2E_TOKEN: ci-domain-token
        run: uv run --frozen pytest tests/test_end_to_end.py -v

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml down -v

  ui-browser:
    name: Browser operator journey
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install browser test dependencies
        run: npm ci

      - name: Create empty Compose environment file
        working-directory: .
        run: touch .env

      - name: Start browser test stack
        working-directory: .
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml up -d --build redis mongo scheduler worker ui

      - name: Wait for the UI
        working-directory: .
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "UI did not become ready within 60 seconds" >&2
          exit 1

      - name: Run authenticated operator journey
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173
        run: npx cypress run --spec cypress/e2e/operator-auth.cy.ts

      - name: Show service logs after failure
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml logs --no-color

      - name: Stop browser test stack
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml down -v

  acceptance:
    name: Acceptance suite (release-gated)
    # tests/acceptance/ is opt-in and deliberately never runs on every PR
    # (minutes, not seconds; needs a live deployment) -- only run it on the
    # release-please-created release PR, one last real-deployment check
    # before a version actually ships.
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test environment
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Create empty Compose environment file
        run: touch .env

      # Fixed project name (-p) so the Compose-generated network name
      # (<project>_backend) is deterministic -- the acceptance suite's
      # "docker" backend needs that name to attach its own throwaway worker
      # containers (which it builds/runs itself; see tests/acceptance/README.md).
      - name: Start scheduler dependencies
        run: docker compose -p hydra-acceptance -f docker-compose.yml -f .github/compose.e2e.yml up -d --build redis mongo scheduler

      - name: Wait for the scheduler
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Scheduler did not become ready within 60 seconds" >&2
          exit 1

      - name: Run acceptance suite
        env:
          HYDRA_ACCEPTANCE: "1"
          ACCEPTANCE_API_URL: http://127.0.0.1:8000
          ACCEPTANCE_ADMIN_TOKEN: ci-admin-token
          ACCEPTANCE_BACKEND: docker
          ACCEPTANCE_DOCKER_NETWORK: hydra-acceptance_backend
          # Deterministic thanks to the fixed -p hydra-acceptance project name;
          # enables the Redis/Mongo restart resilience tests in
          # tests/acceptance/test_50_resilience.py instead of skipping them.
          ACCEPTANCE_DOCKER_REDIS_CONTAINER: hydra-acceptance-redis-1
          ACCEPTANCE_DOCKER_MONGO_CONTAINER: hydra-acceptance-mongo-1
        run: uv run --frozen pytest tests/acceptance -v

      - name: Show service logs after failure
        if: failure()
        run: docker compose -p hydra-acceptance -f docker-compose.yml -f .github/compose.e2e.yml logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose -p hydra-acceptance -f docker-compose.yml -f .github/compose.e2e.yml down -v
