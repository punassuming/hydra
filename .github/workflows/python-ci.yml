name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Run tests
        run: |
          uv run --frozen pytest tests/ --ignore=tests/test_end_to_end.py -v --basetemp="${{ runner.temp }}/pytest"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Run ruff
        run: uv run --frozen ruff check .

  helm:
    name: Helm chart lint + template
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: helm lint (strict)
        run: helm lint deploy/helm/hydra --strict

      - name: helm template — default values
        run: helm template hydra deploy/helm/hydra

      - name: helm template — separated scheduler mode + ingress enabled
        run: |
          helm template hydra deploy/helm/hydra \
            --set scheduler.mode=separated \
            --set ingress.enabled=true \
            --set ingress.className=nginx

      - name: helm template — multi-domain worker pools
        run: |
          cat > /tmp/multi-domain-values.yaml <<'EOF'
          workers:
            - name: python-default
              flavor: python
              replicas: 2
              domain: prod
              tags: "batch,data"
              allowedUsers: ""
              maxConcurrency: 4
              workerState: online
              requireRedisAcl: true
              image: {repository: hydra-worker, tag: latest}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 1Gi}
              autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 10, targetCPUUtilizationPercentage: 70}
              nodeSelector: {}
              tolerations: []
              affinity: {}
            - name: ml-pool
              flavor: go
              replicas: 1
              domain: ml
              tags: "ml"
              allowedUsers: ""
              maxConcurrency: 2
              workerState: online
              requireRedisAcl: true
              image: {repository: hydra-go-worker, tag: latest}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              autoscaling: {enabled: false, minReplicas: 1, maxReplicas: 10, targetCPUUtilizationPercentage: 70}
              nodeSelector: {}
              tolerations: []
              affinity: {}
          domainSeed:
            defaultDomain: prod
            extraDomains: ["ml"]
            image: {repository: hydra-scheduler, tag: latest}
          EOF
          helm template hydra deploy/helm/hydra -f /tmp/multi-domain-values.yaml

      - name: helm template — demoMode + extraEnv (regression check for the scheduler env/envFrom merge)
        run: |
          helm template hydra deploy/helm/hydra \
            --set demoMode.enabled=true \
            --set scheduler.extraEnv[0].name=EXTRA_ENV_TEST \
            --set scheduler.extraEnv[0].value=ok \
            > /tmp/demo-mode-render.yaml
          python3 - <<'PY'
          import sys
          import yaml

          docs = list(yaml.safe_load_all(open("/tmp/demo-mode-render.yaml")))
          scheduler_deploy = next(
              d for d in docs
              if d and d.get("kind") == "Deployment" and d["metadata"]["name"] == "hydra-scheduler"
          )
          container = scheduler_deploy["spec"]["template"]["spec"]["containers"][0]

          # extraEnv / demoMode must land in their own "env" list, never merged
          # into "envFrom" (whose items only ever have configMapRef/secretRef).
          for item in container.get("envFrom", []):
              assert set(item.keys()) <= {"configMapRef", "secretRef", "prefix"}, f"bad envFrom entry: {item}"

          env_names = {e["name"] for e in container.get("env", [])}
          assert "HYDRA_DEMO_MODE" in env_names, f"HYDRA_DEMO_MODE missing from env: {env_names}"
          assert "EXTRA_ENV_TEST" in env_names, f"EXTRA_ENV_TEST missing from env: {env_names}"
          print("OK: env/envFrom rendered correctly with demoMode + extraEnv set")
          PY

  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: scheduler
            context: .
            dockerfile: scheduler/Dockerfile
          - service: worker
            context: .
            dockerfile: worker/Dockerfile
          - service: ui
            context: ui
            dockerfile: ui/Dockerfile
          - service: go-worker
            context: go-worker
            dockerfile: go-worker/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.dockerfile }} -t hydra-${{ matrix.service }}:ci ${{ matrix.context }}

  go-test:
    name: Go worker tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-worker/go.mod
          cache-dependency-path: go-worker/go.sum

      - name: Run Go worker tests
        working-directory: go-worker
        run: go test ./...

  end-to-end:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test environment
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Create empty Compose environment file
        run: touch .env

      - name: Start scheduler dependencies and worker
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml up -d --build redis mongo scheduler worker

      - name: Run full-stack smoke test
        env:
          HYDRA_E2E: "1"
          HYDRA_E2E_DOMAIN: ci
          HYDRA_E2E_TOKEN: ci-domain-token
        run: uv run --frozen pytest tests/test_end_to_end.py -v

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml down -v

  ui-browser:
    name: Browser operator journey
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install browser test dependencies
        run: npm ci

      - name: Create empty Compose environment file
        working-directory: .
        run: touch .env

      - name: Start browser test stack
        working-directory: .
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml up -d --build redis mongo scheduler worker ui

      - name: Wait for the UI
        working-directory: .
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "UI did not become ready within 60 seconds" >&2
          exit 1

      - name: Run authenticated operator journey
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:5173
        run: npx cypress run --spec cypress/e2e/operator-auth.cy.ts

      - name: Show service logs after failure
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml logs --no-color

      - name: Stop browser test stack
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml down -v
