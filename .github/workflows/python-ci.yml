name: Python CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Run tests
        run: |
          uv run --frozen pytest tests/ --ignore=tests/test_end_to_end.py -v --basetemp="${{ runner.temp }}/pytest"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Run ruff
        run: uv run --frozen ruff check .

  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: scheduler
            context: .
            dockerfile: scheduler/Dockerfile
          - service: worker
            context: .
            dockerfile: worker/Dockerfile
          - service: ui
            context: ui
            dockerfile: ui/Dockerfile
          - service: go-worker
            context: go-worker
            dockerfile: go-worker/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -f ${{ matrix.dockerfile }} -t hydra-${{ matrix.service }}:ci ${{ matrix.context }}

  go-test:
    name: Go worker tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-worker/go.mod
          cache-dependency-path: go-worker/go.sum

      - name: Run Go worker tests
        working-directory: go-worker
        run: go test ./...

  end-to-end:
    name: Full-stack smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test environment
        run: |
          python -m pip install uv==0.5.13
          uv sync --frozen --dev

      - name: Create empty Compose environment file
        run: touch .env

      - name: Start scheduler dependencies and worker
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml up -d --build redis mongo scheduler worker

      - name: Run full-stack smoke test
        env:
          HYDRA_E2E: "1"
          HYDRA_E2E_DOMAIN: ci
          HYDRA_E2E_TOKEN: ci-domain-token
        run: uv run --frozen pytest tests/test_end_to_end.py -v

      - name: Show service logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.yml -f .github/compose.e2e.yml down -v
