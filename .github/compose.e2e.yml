services:
  scheduler:
    environment:
      ADMIN_TOKEN: ci-admin-token
      SEED_DOMAIN: ci
      SEED_DOMAIN_TOKEN: ci-domain-token

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        HYDRA_WORKER_UID: ${HYDRA_WORKER_UID:-10001}
        HYDRA_WORKER_GID: ${HYDRA_WORKER_GID:-10001}
    user: "${HYDRA_WORKER_UID:-10001}:${HYDRA_WORKER_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt: ["no-new-privileges:true"]
    environment:
      API_TOKEN: ci-domain-token
      DOMAIN: ci
      REDIS_URL: redis://redis:6379/0
      WORKER_ID: ci-worker
      WORKER_REQUIRE_REDIS_ACL: "false"
    depends_on:
      redis:
        condition: service_healthy
      scheduler:
        condition: service_healthy
    # redis/scheduler live on the base file's internal "backend" network —
    # this worker is introduced fresh by this overlay (docker-compose.yml
    # has no bundled worker), so without this it falls back to Compose's
    # separate implicit "default" network and can't reach either.
    networks: [backend]
