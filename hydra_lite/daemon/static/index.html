<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2330; --muted:#5b6678; --line:#d9dee7; --accent:#2457d6;
          --ok:#116b34; --bad:#a3191f; --warn:#8a5a00; --run:#0b5cab; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161d; --panel:#1b212b; --text:#e6e9ef; --muted:#9aa5b8; --line:#2d3646; --accent:#7aa2ff;
            --ok:#5fd08a; --bad:#ff8a8f; --warn:#f0c060; --run:#7cc0ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:.75rem 1.5rem; align-items:center; padding:.75rem 1rem; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:1.1rem; margin:0; } h1 small { color:var(--muted); font-weight:400; }
  #health { color:var(--muted); }
  nav { display:flex; gap:.25rem; padding:.5rem 1rem 0; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; border-bottom:none; padding:.45rem .9rem; border-radius:6px 6px 0 0; color:var(--muted); cursor:pointer; font:inherit; }
  nav button[aria-selected="true"] { background:var(--panel); border-color:var(--line); color:var(--text); font-weight:600; }
  main { margin:0 1rem 2rem; padding:1rem; background:var(--panel); border:1px solid var(--line); border-radius:0 8px 8px 8px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; } caption { text-align:left; color:var(--muted); padding-bottom:.4rem; }
  th, td { text-align:left; padding:.35rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
  td.wrap { white-space:normal; word-break:break-word; }
  tbody tr.click { cursor:pointer; } tbody tr.click:hover, tbody tr.click:focus { background:color-mix(in srgb, var(--accent) 10%, transparent); outline:none; }
  .st { font-weight:600; } .st-success { color:var(--ok); } .st-failed, .st-timed_out { color:var(--bad); } .st-running, .st-dispatched { color:var(--run); } .st-pending { color:var(--warn); }
  .muted { color:var(--muted); } .row { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-bottom:.8rem; }
  input, select, button.btn { font:inherit; padding:.3rem .5rem; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--text); }
  button.btn { cursor:pointer; } button.btn:focus-visible, input:focus-visible, select:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:.6rem; overflow:auto; max-height:22rem; margin:.3rem 0 1rem; white-space:pre-wrap; word-break:break-word; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:.2rem 1rem; margin:0 0 1rem; } dt { color:var(--muted); } dd { margin:0; word-break:break-word; }
  #login { max-width:30rem; margin:3rem auto; padding:1.2rem; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  #login input { width:100%; margin:.5rem 0; } .err { color:var(--bad); }
  h2 { font-size:1rem; margin:1.2rem 0 .4rem; }
</style>
</head>
<body>
<header>
  <h1>Hydra <small>lite edition &middot; read-only</small></h1>
  <span id="health" role="status" aria-live="polite">connecting&hellip;</span>
  <span class="muted" id="updated"></span>
</header>

<section id="login" hidden>
  <h2 style="margin-top:0">Sign in</h2>
  <p class="muted">Paste the daemon token (the file <code>token</code> in the data folder, or run <code>hydra-ctl lite ui</code>). It is kept only for this browser tab.</p>
  <form id="login-form"><label for="token">API token</label><input id="token" type="password" autocomplete="off" required>
  <button class="btn" type="submit">Open</button> <span id="login-error" class="err" role="alert"></span></form>
</section>

<div id="app" hidden>
  <nav role="tablist" aria-label="Views" id="tabs"></nav>
  <main id="view" tabindex="-1"></main>
</div>

<script>
"use strict";
const API = location.origin;
const ICON = { success: "✓", failed: "✗", timed_out: "⏱", running: "▶", dispatched: "▶", pending: "…" };
const TABS = [["runs", "Runs"], ["jobs", "Jobs"], ["workers", "Workers"], ["queue", "Queue"], ["artifacts", "Artifacts"]];
let token = null, timer = null, current = { tab: "runs", run: null, job: null }, filters = { status: "", text: "" }, logPos = {};

// ---- tiny DOM helper: everything is built from text nodes, never raw HTML, so job names and logs cannot inject markup
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const fmt = (ts) => (ts ? new Date(ts).toLocaleString() : "–");
const dur = (s) => (s == null ? "–" : s < 90 ? s.toFixed(1) + " s" : (s / 60).toFixed(1) + " min");
const status = (s) => h("span", { class: "st st-" + s }, (ICON[s] || "?") + " " + s);

async function api(path) {
  const r = await fetch(API + path, { headers: { "x-api-key": token } });
  if (r.status === 401) { signOut("That token was not accepted."); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}
function signOut(msg) {
  token = null; try { sessionStorage.removeItem("hydra-token"); } catch (e) {}
  document.getElementById("app").hidden = true; document.getElementById("login").hidden = false;
  document.getElementById("login-error").textContent = msg || ""; clearInterval(timer);
}
function signIn(t) {
  token = t; try { sessionStorage.setItem("hydra-token", t); } catch (e) {}
  document.getElementById("login").hidden = true; document.getElementById("app").hidden = false;
  clearInterval(timer); refresh(); timer = setInterval(() => { if (!document.hidden) refresh(); }, 5000);
}

// ---- views
function table(caption, head, rows) {
  return h("table", {}, h("caption", {}, caption), h("thead", {}, h("tr", {}, head.map((c) => h("th", { scope: "col" }, c)))), h("tbody", {}, rows));
}
function clickable(tr, fn) { tr.classList.add("click"); tr.tabIndex = 0; tr.addEventListener("click", fn); tr.addEventListener("keydown", (e) => { if (e.key === "Enter") fn(); }); return tr; }

async function viewRuns(view) {
  if (current.run) return viewRun(view, current.run);
  const runs = await api("/history/?limit=300");
  const shown = runs.filter((r) => (!filters.status || r.status === filters.status) && (!filters.text || (r.job_name || "").toLowerCase().includes(filters.text)));
  const sel = h("select", { id: "f-status", "aria-label": "Filter by status", onchange: (e) => { filters.status = e.target.value; render(); } },
    ["", "pending", "dispatched", "running", "success", "failed", "timed_out"].map((s) => h("option", { value: s, selected: s === filters.status }, s || "all statuses")));
  const txt = h("input", { id: "f-text", type: "search", placeholder: "filter by job name", "aria-label": "Filter by job name", value: filters.text,
    oninput: (e) => { filters.text = e.target.value.toLowerCase(); } , onchange: () => render() });
  view.replaceChildren(h("div", { class: "row" }, sel, txt),
    table(shown.length + " of " + runs.length + " recent runs (newest first)", ["Status", "Job", "Trigger", "Queued", "Duration", "Worker", "Attempt", "Retry #"],
      shown.map((r) => clickable(h("tr", { "data-run": r._id }, h("td", {}, status(r.status)), h("td", {}, r.job_name || r.job_id), h("td", {}, r.trigger || ""),
        h("td", {}, fmt(r.scheduled_ts || r.start_ts)), h("td", {}, dur(r.duration)), h("td", {}, r.worker_id || "–"), h("td", {}, r.attempt ?? ""), h("td", {}, r.retry_attempt ?? 0)),
        () => { current.run = r._id; render(); }))));
}

async function viewRun(view, id) {
  const [run, events] = await Promise.all([api("/runs/" + id), api("/runs/" + id + "/events")]);
  const tail = (s) => { const lines = (s || "").split("\n"); return lines.length > 400 ? "… (" + (lines.length - 400) + " earlier lines omitted)\n" + lines.slice(-400).join("\n") : s || ""; };
  view.replaceChildren(
    h("div", { class: "row" }, h("button", { class: "btn", onclick: () => { current.run = null; render(); } }, "← All runs"), h("strong", {}, run.job_name || run.job_id), status(run.status)),
    h("dl", {}, ...[["Run", run._id], ["Trigger", run.trigger], ["Scheduled", fmt(run.scheduled_ts)], ["Started", fmt(run.start_ts)], ["Ended", fmt(run.end_ts)],
      ["Duration", dur(run.duration)], ["Return code", run.returncode ?? "–"], ["Reason", run.completion_reason || "–"], ["Worker", run.worker_id || "–"],
      ["Attempts", run.attempt ?? 0], ["Scheduler retry #", run.retry_attempt ?? 0], ["Queue latency", run.queue_latency_ms == null ? "–" : run.queue_latency_ms + " ms"],
      ["Params", Object.keys(run.params || {}).length ? JSON.stringify(run.params) : "–"]].flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])),
    h("h2", {}, "Timeline"),
    table("State changes recorded for this run", ["Time", "Event", "Detail"], events.map((e) => h("tr", {}, h("td", {}, fmt(e.ts)), h("td", {}, e.type), h("td", { class: "wrap" }, JSON.stringify(e.detail))))),
    h("h2", {}, "stdout"), h("pre", { tabindex: 0, "aria-label": "standard output" }, tail(run.stdout) || "(empty)"),
    h("h2", {}, "stderr"), h("pre", { tabindex: 0, "aria-label": "standard error" }, tail(run.stderr) || "(empty)"));
}

async function viewJobs(view) {
  const [jobs, runs] = await Promise.all([api("/jobs/"), api("/history/?limit=500")]);
  const last = {}; for (const r of runs) if (!last[r.job_id]) last[r.job_id] = r;
  const sched = (s) => !s ? "" : s.mode === "cron" ? "cron " + s.cron + (s.timezone && s.timezone !== "UTC" ? " (" + s.timezone + ")" : "") : s.mode === "interval" ? "every " + s.interval_seconds + " s" : s.mode;
  const rows = jobs.map((j) => clickable(h("tr", {}, h("td", {}, j.name), h("td", {}, sched(j.schedule)), h("td", {}, j.schedule?.enabled === false ? "disabled" : "enabled"),
    h("td", {}, fmt(j.schedule?.next_run_at)), h("td", {}, last[j._id] ? status(last[j._id].status) : h("span", { class: "muted" }, "never run")), h("td", {}, (j.tags || []).join(", "))),
    async () => { const ev = await api("/jobs/" + j._id + "/schedule_events"); current.job = { job: j, events: ev }; render(); }));
  const d = current.job;
  view.replaceChildren(
    table(jobs.length + " jobs", ["Name", "Schedule", "State", "Next run", "Last run", "Tags"], rows),
    d ? h("div", {}, h("h2", {}, d.job.name + " – definition"), h("pre", { tabindex: 0 }, JSON.stringify(d.job, null, 2)),
      h("h2", {}, "Skipped or dropped ticks"), d.events.length ? table("Scheduling decisions that created no run", ["Time", "Decision", "Detail"], d.events.map((e) =>
        h("tr", {}, h("td", {}, fmt(e.ts)), h("td", {}, e.type), h("td", { class: "wrap" }, JSON.stringify(e.detail))))) : h("p", { class: "muted" }, "none"),
      h("button", { class: "btn", onclick: () => { current.job = null; render(); } }, "Close")) : null);
}

async function viewWorkers(view) {
  const ws = await api("/workers/");
  view.replaceChildren(table(ws.length + " workers", ["Worker", "Connectivity", "State", "Running", "Capacity", "Tags", "Capabilities", "Host", "Last heartbeat"], ws.map((w) => h("tr", {},
    h("td", {}, w.worker_id), h("td", {}, w.connectivity_status), h("td", {}, w.state), h("td", {}, w.current_running), h("td", {}, w.max_concurrency),
    h("td", {}, (w.tags || []).join(", ")), h("td", {}, (w.capabilities || []).join(", ")), h("td", {}, w.hostname || ""),
    h("td", {}, w.last_heartbeat ? new Date(w.last_heartbeat * 1000).toLocaleTimeString() : "–")))));
}

async function viewQueue(view) {
  const [q, p] = await Promise.all([api("/overview/queue"), api("/overview/pressure")]);
  view.replaceChildren(
    h("dl", {}, ...[["Pending", p.pending], ["Running", p.running], ["Capacity", p.capacity], ["Online workers", p.online_workers]].flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)])),
    table(q.pending_total + " pending (showing " + q.pending.length + ")", ["Job", "Trigger", "Queued", "Priority"], q.pending.map((r) =>
      clickable(h("tr", {}, h("td", {}, r.job_name || r.job_id), h("td", {}, r.trigger || ""), h("td", {}, fmt(r.scheduled_ts)), h("td", {}, "")), () => { current.tab = "runs"; current.run = r._id; render(); }))),
    h("h2", {}, "Upcoming"), table("Next scheduled runs", ["Job", "Next run"], q.upcoming.map((u) => h("tr", {}, h("td", {}, u.name), h("td", {}, fmt(u.next_run_at))))));
}

async function viewArtifacts(view) {
  const a = await api("/artifacts/");
  view.replaceChildren(table(a.length + " artifacts", ["Name", "Updated", "Run", "Metadata"], a.map((x) => h("tr", {},
    h("td", {}, x.name), h("td", {}, fmt(x.last_updated)), h("td", {}, x.last_run_id || ""), h("td", { class: "wrap" }, JSON.stringify(x.metadata))))));
}

const VIEWS = { runs: viewRuns, jobs: viewJobs, workers: viewWorkers, queue: viewQueue, artifacts: viewArtifacts };
async function render() {
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...TABS.map(([id, label]) => h("button", { role: "tab", id: "tab-" + id, "aria-selected": String(current.tab === id), onclick: () => { current.tab = id; current.run = null; render(); } }, label)));
  try { await VIEWS[current.tab](document.getElementById("view")); document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString(); }
  catch (e) { if (e.message !== "unauthorized") document.getElementById("view").replaceChildren(h("p", { class: "err", role: "alert" }, "Could not load this view: " + e.message)); }
}
async function refresh() {
  try {
    const hl = await (await fetch(API + "/health")).json();
    document.getElementById("health").textContent = (hl.status === "ok" ? "● running" : "○ " + hl.status) + " · v" + (hl.version || "?") + " · " + hl.pending_jobs + " pending";
  } catch (e) { document.getElementById("health").textContent = "○ daemon unreachable"; }
  await render();
}

// ---- start up: a token in the URL fragment (never sent to the server) is moved to sessionStorage and scrubbed from the address bar
document.getElementById("login-form").addEventListener("submit", (e) => { e.preventDefault(); signIn(document.getElementById("token").value.trim()); });
(function boot() {
  const m = /[#&]token=([^&]+)/.exec(location.hash), run = /[#&]run=([0-9a-f]+)/.exec(location.hash);
  if (run) current.run = run[1];  // deep link to one run: #run=<id>
  if (m) { history.replaceState(null, "", location.pathname + location.search); signIn(decodeURIComponent(m[1])); return; }
  let saved = null; try { saved = sessionStorage.getItem("hydra-token"); } catch (e) {}
  if (saved) signIn(saved); else signOut("");
})();
</script>
</body>
</html>
